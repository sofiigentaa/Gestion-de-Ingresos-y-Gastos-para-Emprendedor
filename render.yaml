# Despliegue en Render como sitio estático (gratis). Los datos y el login
# viven en Supabase. Render → New → Blueprint → elegir este repo.
services:
  - type: web
    name: ingresos-y-gastos
    runtime: static
    branch: main
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeploy: true
    pullRequestPreviewsEnabled: false
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: same-origin
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Supabase → Project Settings → API. La clave "anon" es pública por
      # diseño; lo que protege los datos es el login + RLS (supabase/schema.sql).
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      # "demo" muestra una marca ficticia (para videos o demos públicas).
      - key: VITE_BRAND
        value: ""
